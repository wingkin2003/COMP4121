<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SuperMart</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js"></script>
</head>
<body>
    <form class="login-container" action="">
        <h1>Create Account</h1>
        
        <div class="form-group">
            <label for="reg-username">Username</label>
            <input id="reg-username" type="text" required minlength="7" maxlength="7" placeholder="Enter 7 characters">
        </div>
        
        <div class="form-group">
            <label for="reg-email">Email</label>
            <input id="reg-email" type="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" required placeholder="Create password">
        </div>
        
        <div class="form-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <input id="reg-confirm-password" type="password" required placeholder="Confirm password">
        </div>

        
        <div class="register-link">
            <a href="login.html">Already have an account? Login here</a>
        </div>

    
        <div class="login-reset">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>
    </form>
</body>
</html>
