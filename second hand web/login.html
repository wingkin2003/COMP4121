<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Swap Platform</title>
    <!-- Font Awesome for eye icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="login-container" action="#">
        <h1>Welcome to log in</h1>
        
        <div class="form-group">
            <label for="username">Account</label>
            <input type="text" id="username" name="username" required minlength="7" maxlength="7">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required>
                <i class="toggle-password far fa-eye" id="togglePassword"></i>
            </div>
        </div>
        
        <div class="Register">
            <a href="register.html">Not have account?</a>
        </div>
        
        <div class="login-reset">
            <input type="submit" value="Login">
            <input type="reset" value="Reset">
        </div>
    </form>

    <script src="auth.js"></script>
</body>
</html>
