services:
  - type: web
    name: secondlife-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false  # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false  # e.g. https://your-app.vercel.app
